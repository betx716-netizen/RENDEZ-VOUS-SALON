<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="og-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FDF2F8" />
      <stop offset="60%" stopColor="#F8EEF6" />
      <stop offset="100%" stopColor="#F3D3E4" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#BE185D" />
      <stop offset="100%" stopColor="#7C3AED" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#BE185D" flood-opacity="0.15" />
    </filter>
  </defs>

  {/* Background */}
  <rect width="1200" height="630" fill="url(#og-grad)"/>

  {/* Subtle decorative aurora orbs */}
  <circle cx="1050" cy="120" r="320" fill="#BE185D" fill-opacity="0.08" filter="blur(60px)"/>
  <circle cx="150" cy="500" r="280" fill="#7C3AED" fill-opacity="0.08" filter="blur(60px)"/>
  <circle cx="950" cy="520" r="220" fill="#D4A24C" fill-opacity="0.1" filter="blur(50px)"/>

  {/* Card frame */}
  <g transform="translate(100, 95)" filter="url(#soft-shadow)">
    <rect width="1000" height="440" rx="36" fill="#FFFFFF" stroke="#F3D3E4" stroke-width="2"/>

    {/* Brand Logo & Name */}
    <g transform="translate(60, 60)">
      <rect width="72" height="72" rx="22" fill="#FDF2F8" stroke="#F3D3E4" stroke-width="3"/>
      <g transform="translate(6, 6) scale(0.6)">
        <path d="M 32 25 L 32 75" stroke="#BE185D" stroke-width="9" stroke-linecap="round"/>
        <path d="M 32 25 C 56 22, 68 34, 58 48 C 48 58, 33 54, 32 54" stroke="#BE185D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M 48 50 L 68 75" stroke="#7C3AED" stroke-width="9" stroke-linecap="round"/>
        <circle cx="48" cy="50" r="5" fill="#D4A24C"/>
      </g>
      <text x="96" y="44" font-family="'Playfair Display', Georgia, serif" font-size="36" font-weight="bold" fill="#3B0A24">
        RDV <tspan fill="#BE185D">Salon</tspan>
      </text>
      <text x="96" y="66" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#5B4A56" letter-spacing="1">
        EXPÉRIENCE DE MARQUE • CÔTE D'IVOIRE
      </text>
    </g>

    {/* Main Headline */}
    <text x="60" y="210" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="bold" fill="#3B0A24">
      Remplissez votre salon,
    </text>
    <text x="60" y="265" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="bold" fill="url(#text-grad)">
      sans décrocher le téléphone.
    </text>

    {/* Subtitle */}
    <text x="60" y="325" font-family="'Inter', sans-serif" font-size="19" fill="#5B4A56">
      Réservation mobile en 30 secondes • Rappels WhatsApp • Suivi des encaissements en FCFA
    </text>

    {/* Badges */}
    <g transform="translate(60, 360)">
      <rect width="180" height="38" rx="19" fill="#FDF2F8" stroke="#F3D3E4"/>
      <text x="90" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#BE185D" text-anchor="middle">
        ✓ Réservation 24h/24
      </text>

      <g transform="translate(195, 0)">
        <rect width="180" height="38" rx="19" fill="#FDF2F8" stroke="#F3D3E4"/>
        <text x="90" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#15803D" text-anchor="middle">
          ✓ Rappels WhatsApp
        </text>
      </g>

      <g transform="translate(390, 0)">
        <rect width="210" height="38" rx="19" fill="#FDF2F8" stroke="#F3D3E4"/>
        <text x="105" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#7C3AED" text-anchor="middle">
          ✓ Tarifs en FCFA
        </text>
      </g>
    </g>
  </g>
</svg>
